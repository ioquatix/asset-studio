[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/library",
    "crates/launcher",
    "crates/models",
    "crates/server",
    "crates/client",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Samuel Williams <samuel@ioquatix.com>"]
repository = "https://github.com/ioquatix/asset-studio"
rust-version = "1.87"

[workspace.dependencies]
base-scheduler = "0.3.1"
base-scheduler-native = "0.3.1"
base-http = "0.2.0"
base-http1 = "0.2.0"
base-http-server = "0.2.0"
base-http-client = "0.2.0"
base-endpoint = "0.1.0"
futures-lite = "2.6.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "process", "fs", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
clap = { version = "4", features = ["derive"] }
uuid = { version = "1", features = ["v4", "serde"] }

[profile.release]
lto = "thin"
